name: Update Today's Thought

on:
  schedule:
    # Runs daily at 00:00 IST (18:30 UTC)
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-thought:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate daily thought SVGs
        run: python scripts/update_daily_thought.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet assets/thought-dark.svg assets/thought-light.svg; then
            echo "No changes to Today's Thought SVGs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/thought-dark.svg assets/thought-light.svg
          git commit -m "chore: update Today's Thought"
          git push
