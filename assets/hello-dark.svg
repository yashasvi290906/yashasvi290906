<svg xmlns="http://www.w3.org/2000/svg" width="280" height="54" viewBox="0 0 280 54" role="img" aria-label="Hello there!">
  <defs>
    <path id="typingPath" d="m28,35 h0">
      <animate attributeName="d"
        values="m28,35 h0; m28,35 h185; m28,35 h185; m28,35 h0"
        keyTimes="0; 0.45; 0.85; 1"
        dur="3.6s"
        repeatCount="indefinite" />
    </path>
  </defs>

  <!-- Typing "Hello there!" text -->
  <text font-family="'Fira Code', 'Consolas', 'Courier New', monospace" font-size="24" font-weight="700" fill="#58A6FF">
    <textPath href="#typingPath" startOffset="0%">Hello there!</textPath>
  </text>

  <!-- Blinking cursor tracking typing -->
  <rect y="14" width="2.5" height="24" rx="1" fill="#38BDF8">
    <animate attributeName="x"
      values="28; 205; 205; 28"
      keyTimes="0; 0.45; 0.85; 1"
      dur="3.6s"
      repeatCount="indefinite" />
    <animate attributeName="opacity"
      values="1; 1; 0; 0"
      keyTimes="0; 0.49; 0.5; 1"
      dur="0.8s"
      repeatCount="indefinite" />
  </rect>

  <!-- Animated blue waving hand to the right, appearing as typing completes -->
  <g transform="translate(234, 30)" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0; 0"
      keyTimes="0; 0.38; 0.46; 0.84; 0.90; 1"
      dur="3.6s"
      repeatCount="indefinite" />
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 6 12; 16 6 12; -10 6 12; 16 6 12; 0 6 12; 0 6 12"
        keyTimes="0; 0.12; 0.24; 0.36; 0.48; 1"
        dur="2.2s"
        repeatCount="indefinite" />
      <path d="M-2,-6 L-2,-15 C-2,-16.8 0.5,-16.8 0.5,-15 L0.5,-5
               M2.5,-7 L2.5,-17.5 C2.5,-19.3 5.2,-19.3 5.2,-17.5 L5.2,-5
               M7,-6 L7,-16 C7,-17.8 9.7,-17.8 9.7,-16 L9.7,-3.5
               M11.3,-3.5 L11.3,-11.5 C11.3,-13.2 13.8,-13.2 13.8,-11.5 L13.8,3.5
               C13.8,9.5 9.2,13 3.2,13 C-1.8,13 -5.5,10 -7.5,5.5 L-11,-2
               C-11.8,-3.7 -9.6,-5.1 -8.1,-3.7 L-4.5,0 L-4.5,-11.5 C-4.5,-13.3 -2,-13.3 -2,-11.5"
            fill="#1F6FEB" stroke="#58A6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-13,-10 C-15,-13 -15,-16 -13,-19" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
      <path d="M16,-14 C18.5,-11.5 18.5,-8.5 16,-6" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>
</svg>